# Retrain from scratch; open a PR only if the gate passes (scripts/train_and_release.py).

name: Train and Release Model

on:
  push:
    branches:
      - main
    paths:
      - 'datasets/**.csv'
  workflow_dispatch:
    inputs:
      csv_path:
        description: 'Extra labelled CSV to train on (relative to repo root; empty = repository datasets only)'
        required: false
        default: ''
      min_f1:
        description: 'Floor on the candidate noise F1 (the gate against the current model always applies)'
        required: false
        default: '0.9'
      text_col:
        description: 'CSV column name for copyright text (empty = auto-detect "text" or "copyright")'
        required: false
        default: ''
      label_col:
        description: 'CSV column name for binary label 0/1 (empty = auto-detect "label" or "falsePositive")'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  train-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install

      - name: Collect training CSVs
        id: csvs
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          INPUT_CSV: ${{ inputs.csv_path }}
        run: |
          CORE='^datasets/(false_positive_detection_dataset|false_positive_detection_corrections|osselot_dataset|regression_cases)\.csv$'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            printf '%s\n' "$INPUT_CSV" | grep -v '^$' > extra_csvs.txt || true
          else
            # No usable "before" on a first or force push.
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE="$SHA~1"; fi
            git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'datasets/**.csv' \
              | grep -Ev "$CORE" > extra_csvs.txt || true
          fi
          echo "Extra CSVs:"; cat extra_csvs.txt

      - name: Retrain, gate and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          MIN_F1: ${{ inputs.min_f1 || '0.9' }}
          TEXT_COL: ${{ inputs.text_col }}
          LABEL_COL: ${{ inputs.label_col }}
        run: |
          ARGS=(--min-f1 "$MIN_F1")
          while IFS= read -r csv; do ARGS+=(--csv "$csv"); done < extra_csvs.txt
          [ -n "$TEXT_COL" ] && ARGS+=(--text-col "$TEXT_COL")
          [ -n "$LABEL_COL" ] && ARGS+=(--label-col "$LABEL_COL")
          poetry run python scripts/train_and_release.py "${ARGS[@]}"
